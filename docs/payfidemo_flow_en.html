<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFi Demo Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 15px;
    font-weight: 500;
    color: #94a3b8;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #475569;
    margin-bottom: 20px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  button {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 6px;
    border: 0.5px solid #334155;
    background: transparent;
    cursor: pointer;
    color: #94a3b8;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover { border-color: #64748b; color: #cbd5e1; }
  button.active {
    background: #1e3a5f;
    color: #7dd3fc;
    border-color: #1d4ed8;
  }
  .panel { display: none; }
  .panel.visible { display: block; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .step-dots { display: flex; gap: 5px; }
  .step-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #334155;
    transition: background 0.25s;
    display: inline-block;
  }
  .step-dots span.active { background: #3b82f6; }
  .step-label {
    font-size: 11px;
    color: #475569;
    margin-left: 4px;
  }
  @keyframes flowPulse {
    0%   { stroke-dashoffset: 40; opacity: 0.25; }
    50%  { opacity: 0.9; }
    100% { stroke-dashoffset: 0; opacity: 0.25; }
  }
  .flow-line { stroke-dasharray: 8 4; animation: flowPulse 2s ease-in-out infinite; }
  .flow-line-2 { animation-delay: 0.65s; }
  .flow-line-3 { animation-delay: 1.3s; }
</style>
</head>
<body>

<h1>PayFi Demo Settlement Flow</h1>
<p class="subtitle">Intent API + Escrow (HashKey Testnet primary; Base Sepolia / Anvil optional) + dual EIP-712 release signatures + optional HashKey checkout → <code style="color:#64748b">/payment/result</code> + <code style="color:#64748b">gateway-reconciliation</code> + settlement outbox / merchant webhook</p>

<div class="btn-row">
  <button id="btn-all" onclick="setMode('all')" class="active">Full Flow</button>
  <button id="btn-step" onclick="setMode('step')">Step by Step</button>
  <button id="btn-compare" onclick="setMode('compare')">vs Legacy Manual Flow</button>
</div>

<div id="panel-compare" class="panel">
<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">

<script>
let currentStep = 1;
const totalSteps = 5;

function setMode(mode) {
  document.getElementById("panel-all").classList.remove("visible");
  document.getElementById("panel-step").classList.remove("visible");
  document.getElementById("panel-compare").classList.remove("visible");
  document.getElementById("panel-" + mode).classList.add("visible");
  ["btn-all", "btn-step", "btn-compare"].forEach((id) => {
    document.getElementById(id).classList.remove("active");
  });
  document.getElementById("btn-" + mode).classList.add("active");
}

function showStep(n) {
  for (let i = 1; i <= totalSteps; i++) {
    const el = document.getElementById("s" + i);
    if (el) el.style.display = (i === n) ? "" : "none";
  }
  const dots = document.querySelectorAll(".step-dots span");
  dots.forEach((d, i) => d.classList.toggle("active", i === n - 1));
  document.getElementById("step-label").textContent = "Step " + n + " / " + totalSteps;
}

function nextStep() {
  if (currentStep < totalSteps) {
    currentStep++;
    showStep(currentStep);
  }
}

function prevStep() {
  if (currentStep > 1) {
    currentStep--;
    showStep(currentStep);
  }
}
</script>
